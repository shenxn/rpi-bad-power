[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rpi-bad-power"
version = "0.2.0"
description = "A Python library to detect bad power supply and throttling on Raspberry Pi."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Xiaonan Shen", email = "s@sxn.dev" },
]
keywords = [
    "raspberry-pi",
    "rpi",
    "home-assistant",
    "power",
    "undervoltage",
    "hwmon",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/shenxn/rpi-bad-power"
Repository = "https://github.com/shenxn/rpi-bad-power"
"Bug Tracker" = "https://github.com/shenxn/rpi-bad-power/issues"
Changelog = "https://github.com/shenxn/rpi-bad-power/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["rpi_bad_power"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "D",
    "E",
    "F",
    "FA",
    "I",
    "N",
    "PIE",
    "PT",
    "PTH",
    "RUF",
    "SIM",
    "TC",
    "UP",
    "W",
    "YTT",
]
ignore = [
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "D107"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
warn_unreachable = true

[tool.coverage.run]
branch = true
source = ["rpi_bad_power"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
addopts = "-vv --cov --cov-report=term-missing"
